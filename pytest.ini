[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers

# Auto mode: every `async def test_` is collected without a per-test decorator.
asyncio_mode = auto

# One event loop for the whole session. The SQLAlchemy async engine holds
# pooled asyncpg connections that are bound to the loop that created them, so a
# per-test loop would hand tests connections belonging to a closed loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

markers =
    db: requires a running PostgreSQL (docker compose up -d postgres)
