[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aperture-sample-shop"
version = "0.1.0"
description = "Benchmark e-commerce API used as Aperture's instrumented target application"
requires-python = ">=3.11"

# Every dependency below is load-bearing. See README.md -> 'Dependency rationale'.
dependencies = [
    "fastapi>=0.115,<1.0",          # HTTP layer; ASGI is what the SDK middleware will wrap
    "uvicorn[standard]>=0.30,<1.0", # ASGI server used to actually run the app
    "sqlalchemy[asyncio]>=2.0.30",  # ORM whose event hooks the SDK instruments on Day 3
    "asyncpg>=0.29",                # async PG driver; also gives COPY for fast bulk seeding
    "alembic>=1.13",                # schema migrations (the schema is an experimental control)
    "pydantic>=2.7",                # request/response models, already a FastAPI dependency
    "pydantic-settings>=2.3",       # env-file configuration; split out of pydantic v2 core
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",                  # ASGI transport client used by the test suite
]

[project.scripts]
shop-seed = "shop.seed.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shop*"]
